name: Deploy portfolio to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Publish only the repository's default branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Locate the portfolio
        id: project
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "directory=." >> "$GITHUB_OUTPUT"
          elif [ -f portfolio/package.json ]; then
            echo "directory=portfolio" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No package.json found at the repository root or in portfolio/"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ steps.project.outputs.directory }}/package-lock.json

      - name: Read GitHub Pages settings
        id: pages
        # Enable Settings > Pages > Source: GitHub Actions before the first run.
        # Automatic enablement requires a separate token; GITHUB_TOKEN cannot enable Pages.
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.directory }}
        run: npm ci

      - name: Type-check and build
        working-directory: ${{ steps.project.outputs.directory }}
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}/
          VITE_PRESENCE_URL: ${{ vars.VITE_PRESENCE_URL }}
        run: npm run build

      - name: Check server behavior
        working-directory: ${{ steps.project.outputs.directory }}
        run: npm run test:realtime

      - name: Upload built website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ steps.project.outputs.directory }}/dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

